[package]
name = "healthaccess_audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tamper-evident access-log commitment for HealthAccess on Solana"

[lib]
# "lib" is required, not incidental. `tests/error_codes.rs` links the normally
# compiled crate to pin the `#[error_code]` wire numbers, and `declare_program!`
# needs a linkable lib target too. Dropping it turns `cargo test --features
# anchor` into a compile error, which silently disables the error-code guards.
crate-type = ["cdylib", "lib"]
name = "healthaccess_audit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

# The Anchor entrypoints live behind this feature so that `cargo test` runs the
# pure hash-chain modules with nothing but cargo installed. Task 25 depends on
# this; see docs/hackathon/INTERFACE-CONTRACT.md section 4.
anchor = ["dep:anchor-lang"]

# LiteSVM integration tests (task 29). Opt-in because the Solana stack is a
# heavy dependency graph, and a plain `cargo test` must stay fast and free of
# it. Run with: cargo test --features litesvm
litesvm = [
  "dep:anchor-litesvm",
  "dep:litesvm",
  "dep:solana-message",
  "dep:solana-transaction",
  "dep:solana-signer",
  "dep:solana-keypair",
  "dep:solana-pubkey",
  "dep:solana-system-program",
]

[dependencies]
anchor-lang = { version = "1.2.1", optional = true }
sha2 = "0.10"

# Test-only, but declared as regular optional dependencies: Cargo does not allow
# optional dev-dependencies. Unused in the library, so they cost nothing at
# runtime and never appear in the program binary.
#
# Versions are pinned to what `anchor-litesvm` 0.4.0 resolves. Mismatching them
# (litesvm 0.15 against its 0.11 expectation) fails to compile deep inside the
# litesvm crate with confusing struct-field errors.
anchor-litesvm = { version = "0.4.0", optional = true }
litesvm = { version = "0.11.0", optional = true }
solana-message = { version = "3", optional = true }
solana-transaction = { version = "3", optional = true }
solana-signer = { version = "3", optional = true }
solana-keypair = { version = "3", optional = true }
solana-pubkey = { version = "3", optional = true }
solana-system-program = { version = "3", optional = true }

[dev-dependencies]
hex = "0.4"
# Already in the lockfile via anchor-lang; used only to parse the committed IDL
# in the program-id consistency test. Pinning the same major keeps `Cargo.lock`
# unchanged.
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }