[package]
name = "healthaccess_audit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tamper-evident access-log commitment for HealthAccess on Solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "healthaccess_audit"

[features]
default = []
# The Anchor entrypoints (lib.rs). Off by default so that `cargo test` runs the
# pure hash-chain modules with nothing but cargo installed. Task 25 depends on
# this: see docs/hackathon/INTERFACE-CONTRACT.md section 4.
anchor = ["dep:anchor-lang"]

[dependencies]
anchor-lang = { version = "0.32.0", optional = true }
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"